name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bun run prepare:submission
      - uses: actions/upload-artifact@v4
        with:
          name: pushwing-openai
          path: dist/pushwing-openai.zip
          if-no-files-found: error
