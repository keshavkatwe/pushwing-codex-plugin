name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the installable package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path.cwd()
          plugin = root / 'plugins/pushwing'
          skills = {'setup', 'publish', 'schedule', 'status', 'report'}
          manifest = json.loads((plugin / 'plugin.json').read_text())
          assert manifest['name'] == 'pushwing'
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', manifest['version'])
          assert manifest['$schema'] == 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json'
          host = manifest['extensions']['com.openai']
          assert not manifest.get('apps') and not host.get('apps')
          assert host['onboardingSkill'] == './skills/setup/SKILL.md'
          assert 0 < len(host['interface']['shortDescription']) <= 30
          for key in ('logo', 'composerIcon'):
              asset = (plugin / host['interface'][key]).resolve()
              assert asset.is_relative_to(plugin.resolve()) and asset.is_file()
          mcp = json.loads((plugin / 'mcp.json').read_text())
          assert mcp['$schema'] == 'https://agent-plugins.org/schemas/1.0.0/mcp.schema.json'
          assert mcp['mcpServers'] == {'pushwing': {'type': 'streamable-http', 'url': 'https://mcp.pushwing.com/mcp'}}
          catalog = json.loads((root / '.agents/plugins/marketplace.json').read_text())
          assert catalog['name'] == 'pushwing-plugins'
          assert len(catalog['plugins']) == 1
          entry = catalog['plugins'][0]
          assert entry['name'] == 'pushwing'
          assert entry['source'] == {'source': 'local', 'path': './plugins/pushwing'}
          assert entry['policy'] == {'installation': 'AVAILABLE', 'authentication': 'ON_INSTALL'}
          assert entry['category'] == 'Productivity'
          expected = {'README.md', 'plugin.json', 'mcp.json', 'assets/icon.svg'}
          for name in skills:
              expected |= {f'skills/{name}/SKILL.md', f'skills/{name}/agents/openai.yaml'}
              text = (plugin / f'skills/{name}/SKILL.md').read_text()
              assert text.startswith('---\n') and '\n---\n' in text[4:]
              header, body = text[4:].split('\n---\n', 1)
              assert f'name: {name}' in header and re.search(r'^description: .+', header, re.M)
              assert '## Shared Pushwing workflow' in body
              assert '`pushwing_list_connections`' in body
              assert 'confirm=false' in body and 'Wait for the user to approve' in body
          paths = list(plugin.rglob('*'))
          assert not any(path.is_symlink() for path in paths)
          assert {path.relative_to(plugin).as_posix() for path in paths if path.is_file()} == expected
          for path in root.rglob('*.json'):
              json.loads(path.read_text())
          print(f"Validated Pushwing {manifest['version']}: marketplace, hosted MCP and five skills")
          PY
      - name: Package the plugin
        working-directory: plugins/pushwing
        run: zip -q -r "$RUNNER_TEMP/pushwing-openai.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: pushwing-openai
          path: ${{ runner.temp }}/pushwing-openai.zip
          if-no-files-found: error
